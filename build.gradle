plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Ladysnake Libs"
		url = 'https://maven.ladysnake.org/releases'
	}
      maven {
		  name = "Terraformers"
		  url = "https://maven.terraformersmc.com/"}
	  maven { url = "https://api.modrinth.com/maven"}
	  maven {
		  // location of the maven that hosts JEI files before January 2023
		  name = "Progwml6's maven"
		  url = "https://dvs1.progwml6.com/files/maven/"
	  }
	  maven {
		  // location of the maven that hosts JEI files since January 2023
		  name = "Jared's maven"
		  url = "https://maven.blamejared.com/"
	  }
	  maven {
		  // location of a maven mirror for JEI files, as a fallback
		  name = "ModMaven"
		  url = "https://modmaven.dev"
	  }
	  maven {
		url = "https://maven.shedaniel.me"
	  }
	  maven {
		url = "https://maven.architectury.dev"
		content {
			includeGroup "dev.architectury"
		}
	  }
	maven {
		url = "https://maven.createmod.net/"
	}
	maven {
		url = "https://mvn.devos.one/snapshots/"
	}
	maven {
		url = "https://mvn.devos.one/releases/"
	}
	maven {
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven"
	}
	maven {
		url = "https://maven.jamieswhiteshirt.com/libs-release"
	}
}

loom {
	accessWidenerPath = file('src/main/resources/kaleidoscope_tavern.accessWidener')
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation(include("com.jamieswhiteshirt:reach-entity-attributes:2.4.0"))
	modImplementation(include("io.github.fabricators_of_create.Porting-Lib:loot:2.3.15+1.20.1"))
	modImplementation(include("io.github.fabricators_of_create.Porting-Lib:transfer:2.3.15+1.20.1"))
	modImplementation(include("io.github.fabricators_of_create.Porting-Lib:base:2.3.15+1.20.1"))
	//implementation("com.terraformersmc:modmenu:${project.modmenu_version}")
	modImplementation "maven.modrinth:jade:${project.jade_version}"
	modImplementation("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}")
	// Mezz config
	modImplementation "maven.modrinth:7tEfOcA7:SYfAcmwJ"
	//modCompileOnly "dev.emi:emi-fabric:1.1.24+1.20.1:api"
	//modCompileOnly "dev.emi:emi-fabric:1.1.24+1.20.1"
	modCompileOnly "maven.modrinth:emi:${emi_version}"
	modCompileOnly "maven.modrinth:dragonlib:uz4tlLzk"
	//Create
	modImplementation "com.simibubi.create:create-fabric:6.0.8.1+build.1744-mc1.20.1"
	// REI 前置
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:11.1.106"
	modImplementation "dev.architectury:architectury-fabric:9.2.14"
	// REI API for Forge (ForgeGradle)
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:12.1.785"
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:12.1.785"
	modCompileOnly "maven.modrinth:rei:12.1.785+fabric-fabric,1.20.1"
	modCompileOnly "dev.emi:trinkets:3.7.2"
	modImplementation ("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:8.0.3")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
